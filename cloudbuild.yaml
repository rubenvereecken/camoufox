# Cloud Build config for camoufox-base image.
#
# Triggered on tags matching v*-ruben.* pushed to rubenvereecken/camoufox.
# First build is cold (~30-60 min on e2-highcpu-32). Subsequent builds with
# unchanged source hit Docker layer cache and finish in minutes.
#
# Manual submit:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_CAMOUFOX_TAG=146.0.1-ruben.dev.2 \
#     --project=drivingtestuk \
#     --region=europe-west2

steps:
  # Build the multi-stage image (compile + runtime).
  # DOCKER_BUILDKIT=1 enables BuildKit for --mount=type=cache in the Dockerfile.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.prod
      # Bake the building commit into version.json (truthful provenance — the
      # deploy gate asserts it). The main-push trigger sets _GIT_COMMIT=$COMMIT_SHA;
      # for a manual `gcloud builds submit`, pass
      # --substitutions=_GIT_COMMIT=$(git rev-parse HEAD).
      - --build-arg
      - GIT_COMMIT=${_GIT_COMMIT}
      - -t
      - $_IMAGE:${_CAMOUFOX_TAG}
      - -t
      - $_IMAGE:latest
      - .
    env:
      - DOCKER_BUILDKIT=1

  # Push both tags to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_IMAGE

  # Extract the packaged .zip from the image and upload to GCS.
  # Useful for installing Camoufox on dev Linux machines without rebuilding.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        id=$$(docker create $_IMAGE:${_CAMOUFOX_TAG})
        docker cp $$id:/camoufox /workspace/camoufox-extract
        docker rm $$id
        apt-get update -qq && apt-get install -y -qq zip >/dev/null
        cd /workspace/camoufox-extract
        zip -qr /workspace/camoufox-${_CAMOUFOX_TAG}-lin.x86_64.zip .

  - name: gcr.io/cloud-builders/gsutil
    args:
      - cp
      - /workspace/camoufox-${_CAMOUFOX_TAG}-lin.x86_64.zip
      - gs://drivingtestuk-camoufox-artifacts/

  # Cascade: fire the dev bot rebuild so dev tracks this fresh base (:latest).
  # This is the single line that makes "dev auto-tracks latest" automatic —
  # fork push → base builds (here) → dvsa-bot-dev rebuilds the bot FROM
  # camoufox-base:latest and deploys to the dev container. PROD IS UNTOUCHED:
  # it stays pinned to _CAMOUFOX_TAG in cloudbuild-bot.yaml and only moves on a
  # deliberate pin bump. Best-effort — the base image is already built+pushed
  # above, so a failure to fire the dev trigger must not fail the base build.
  # Runs as ci-deployer (cloudbuild.builds.builder → can run triggers).
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud builds triggers run dvsa-bot-dev \
          --region=europe-west2 --branch=main \
          || echo "WARN: could not fire dvsa-bot-dev trigger — base image is still built+pushed; run it manually to refresh dev"

substitutions:
  _CAMOUFOX_TAG: '146.0.1-ruben.dev.3'
  _GIT_COMMIT: ''
  _IMAGE: 'europe-west2-docker.pkg.dev/drivingtestuk/bot-images/camoufox-base'

options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: '200'
  logging: CLOUD_LOGGING_ONLY

timeout: 5400s

images:
  - $_IMAGE:${_CAMOUFOX_TAG}
  - $_IMAGE:latest

# TODO [build-affordability — designed, not yet implemented]: persist the
# compile cache across builds so source-changed rebuilds are fast.
#
# Today every Cloud Build is cold (~30-60 min): the BuildKit --mount=type=cache
# for /ccache and /root/.mozbuild in Dockerfile.prod starts EMPTY on Cloud
# Build's ephemeral workers, so `make build` recompiles from scratch every time.
#
# Classic `docker build --cache-from` does NOT fix this for a multi-stage build:
# inline cache only covers stages that reach the final image, NOT the builder
# (compile) stage, and it can't persist a cache-mount. The two approaches that
# actually work — both need validation across two real builds before trusting:
#
#   A. buildx registry cache (preferred): switch the build step to
#      `docker buildx build --cache-to=type=registry,ref=$_IMAGE:buildcache,mode=max
#      --cache-from=type=registry,ref=$_IMAGE:buildcache`. mode=max exports ALL
#      stages incl. the builder compile AND the /ccache mount. Requires a
#      `docker buildx create --use` step and reworking push/extract (buildx
#      --push uploads directly; the zip-extract step then needs --load or a pull).
#   B. GCS ccache round-trip: gsutil cp gs://drivingtestuk-ccache/camoufox/ →
#      seed /ccache → build → tar + cp back. Needs the compile moved to native
#      Cloud Build steps (so /workspace/ccache survives), not `docker build`.
#
# Payoff once enabled: a C++ patch change ~10-20 min (ccache hit); a juggler
# JS-only change (additions/juggler/**) is near-instant — no C++ recompile, just
# relink + omni.ja repackage. The first build after enabling establishes the
# cache; the second proves the warm path.
